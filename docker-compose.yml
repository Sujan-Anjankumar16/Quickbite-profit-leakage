# QuickBite Profit Leakage Analyzer - local stack
#   docker compose up -d          start MySQL, MongoDB, Redis
#   docker compose ps             all three should say "healthy"
#   docker compose down -v        stop AND wipe data (re-runs the init scripts next time)
#
# MySQL runs every *.sql file in db/mysql/ in name order, but ONLY on the
# first start with an empty volume. After changing a .sql file, either
# run `docker compose down -v` or apply the file by hand.

services:
  mysql:
    image: mysql:8.4
    container_name: qb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: quickbite
      TZ: Asia/Kolkata
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: qb-mongo
    environment:
      MONGO_INITDB_DATABASE: quickbite
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro   # filled in at Step 7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qb-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Next.js app (Step 8). Started only with:  docker compose --profile app up -d
  web:
    profiles: ["app"]
    build: ./web
    container_name: qb-web
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  mysql_data:
  mongo_data:
